name: Release

# Build prebuilt `yapayapa` client binaries and attach them to a GitHub
# Release whenever a version tag (e.g. v0.1.0) is pushed. install.sh then
# downloads these so users never need Rust or the source.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: yapayapa
            asset: yapayapa-linux-x86_64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: yapayapa
            asset: yapayapa-macos-aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: yapayapa.exe
            asset: yapayapa-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release client
        run: cargo build --release -p yapayapa --target ${{ matrix.target }}

      - name: Stage binary
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
